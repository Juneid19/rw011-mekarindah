<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inject Seksi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f0f0f0;padding:16px;color:#333}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{color:#0d7a3a;margin-bottom:4px;font-size:18px}
.sub{font-size:13px;color:#888;margin-bottom:14px}
.st{padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px;line-height:1.5}
.st.ok{background:#d4edda;color:#155724}
.st.er{background:#f8d7da;color:#721c24}
.st.in{background:#d1ecf1;color:#0c5460}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:14px}
input[type=text],input[type=url]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
input[type=file]{margin:6px 0;font-size:14px}
.or{text-align:center;color:#aaa;font-size:12px;margin:2px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px}
.bp{background:#0d7a3a;color:#fff}
.bp:active{background:#0a5c2c}
.bp:disabled{background:#999}
.bd{background:#dc3545;color:#fff;margin-top:8px}
.bd:active{background:#a71d2a}
.pv{margin-top:8px}
.pv img{max-width:120px;border-radius:8px;border:2px solid #0d7a3a}
.di{font-size:11px;color:#aaa;margin-bottom:6px}
.warn{background:#fff3cd;color:#856404;padding:10px;border-radius:8px;font-size:13px;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h2>Suntik Seksi Dewan Warga</h2>
  <p class="sub">Menambahkan data ke database Firestore</p>
  <div id="st" class="st in">Mencari dokumen...</div>
  <div id="di" class="di"></div>
  <form id="fm">
    <label>Nama Koordinator</label>
    <input type="text" id="nm" placeholder="Contoh: Bpk. Ahmad Sudrajat" required>
    <label>Foto Koordinator</label>
    <input type="file" id="fl" accept="image/*">
    <div class="or">atau paste URL gambar</div>
    <input type="url" id="fu" placeholder="https://lh3.googleusercontent.com/...">
    <div id="pv" class="pv"></div>
    <button type="submit" class="btn bp" id="bs">Suntik ke Database</button>
    <button type="button" class="btn bd" id="bd" style="display:none">Hapus Data Seksi Ini</button>
  </form>
  <div class="warn" id="wn" style="display:none">
    <strong>Perlu login?</strong> Kalau muncul error permission, buka admin.html dulu di tab lain, login, lalu reload halaman ini.
  </div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,getDocs,doc,updateDoc,deleteField}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const cfg={
  apiKey:"AIzaSyB3soQUtEAn0J09uBWQT6JeGhZGnGmCUZc",
  authDomain:"rw011-mekarindah.firebaseapp.com",
  projectId:"rw011-mekarindah",
  storageBucket:"rw011-mekarindah.firebasestorage.app",
  messagingSenderId:"1080174436962",
  appId:"1:1080174436962:web:6fdd796771013291b4273b"
};
const app=initializeApp(cfg);
const db=getFirestore(app);
const stg=getStorage(app);

const $st=document.getElementById('st');
const $di=document.getElementById('di');
const $nm=document.getElementById('nm');
const $fl=document.getElementById('fl');
const $fu=document.getElementById('fu');
const $pv=document.getElementById('pv');
const $bs=document.getElementById('bs');
const $bd=document.getElementById('bd');
const $wn=document.getElementById('wn');

let tRef=null;

function ss(m,t){$st.className='st '+t;$st.textContent=m}

 $fu.addEventListener('input',()=>{
  const u=$fu.value.trim();
  $pv.innerHTML=u?'<img src="'+u+'" onerror="this.parentElement.innerHTML=\'\'">':'';
});

 $fl.addEventListener('change',()=>{
  if($fl.files[0]){
    const r=new FileReader();
    r.onload=e=>{$pv.innerHTML='<img src="'+e.target.result+'">';$fu.value='';};
    r.readAsDataURL($fl.files[0]);
  }
});

async function find(){
  try{
    const snap=await getDocs(collection(db,'settings'));
    if(snap.empty){ss('Koleksi "settings" kosong!','er');return}
    for(const d of snap.docs){
      const data=d.data();
      if(data.data_seksi&&typeof data.data_seksi==='object'){
        tRef=doc(db,'settings',d.id);
        $di.textContent='Dokumen: settings/'+d.id;
        if(data.data_seksi.dewan_warga)$nm.value=data.data_seksi.dewan_warga;
        if(data.data_seksi_foto&&data.data_seksi_foto.dewan_warga){
          $fu.value=data.data_seksi_foto.dewan_warga;
          $pv.innerHTML='<img src="'+data.data_seksi_foto.dewan_warga+'" onerror="this.parentElement.innerHTML=\'\'">';
          $bd.style.display='block';
        }
        ss('Dokumen ditemukan! Siap disuntik.','ok');
        return;
      }
    }
    ss('Tidak ada dokumen dengan field "data_seksi"','er');
  }catch(e){
    ss('Error: '+e.message,'er');
  }
}
find();

document.getElementById('fm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!tRef){ss('Dokumen belum ditemukan!','er');return}
  const nm=$nm.value.trim();
  if(!nm){ss('Nama harus diisi!','er');return}
  $bs.disabled=true;$bs.textContent='Menyuntik...';ss('Memproses...','in');$wn.style.display='none';
  try{
    let fu=$fu.value.trim();
    if($fl.files[0]&&!fu){
      ss('Mengupload foto...','in');
      const f=$fl.files[0];
      const sr=ref(stg,'seksi/dewan_warga_'+Date.now()+'.'+f.name.split('.').pop());
      await uploadBytes(sr,f);
      fu=await getDownloadURL(sr);
      $fu.value=fu;
    }
    const up={"data_seksi.dewan_warga":nm};
    if(fu)up["data_seksi_foto.dewan_warga"]=fu;
    await updateDoc(tRef,up);
    ss('Berhasil! '+nm+(fu?' (dengan foto)':' (tanpa foto)'),'ok');
    $bd.style.display='block';
    setTimeout(()=>ss('Selesai! Hapus file ini lalu deploy ulang.','ok'),2000);
  }catch(e){
    ss('Error: '+e.message,'er');
    if(/permission|PERMISSION_DENIED/i.test(e.message))$wn.style.display='block';
  }finally{$bs.disabled=false;$bs.textContent='Suntik ke Database'}
});

 $bd.addEventListener('click',async()=>{
  if(!tRef)return;
  if(!confirm('Hapus data Seksi Dewan Warga?'))return;
  $bd.disabled=true;$bd.textContent='Menghapus...';
  try{
    await updateDoc(tRef,{
      "data_seksi.dewan_warga":deleteField(),
      "data_seksi_foto.dewan_warga":deleteField()
    });
    $nm.value='';$fu.value='';$pv.innerHTML='';$bd.style.display='none';
    ss('Data Seksi Dewan Warga berhasil dihapus.','ok');
  }catch(e){ss('Error: '+e.message,'er')}
  finally{$bd.disabled=false;$bd.textContent='Hapus Data Seksi Ini'}
});
</script>
</body>
</html>
