          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          pageDiv.appendChild(canvas);
          bookContainer.appendChild(pageDiv);
        }

        loadingEl.style.display = 'none';
        bookContainer.style.visibility = 'visible';
        controlsEl.style.display = 'flex';

        const pageFlip = new St.PageFlip(bookContainer, {
          width: Math.round(viewport1.width),
          height: Math.round(viewport1.height),
          size: "stretch", minWidth: 300, maxWidth: 2000, minHeight: 400, maxHeight: 3000,
          showCover: true, mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        pageFlip.on('flip', (e) => {
          const current = e.data + 1;
          currentPageEl.textContent = current;
          btnPrev.disabled = (current === 1);
          btnNext.disabled = (current === totalPages);
        });

        btnPrev.addEventListener('click', () => pageFlip.flipPrev());
        btnNext.addEventListener('click', () => pageFlip.flipNext());
        btnPrev.disabled = true;
      } catch (err) {
        loadingEl.innerText = "Gagal memuat dokumen offline.";
      }
    }
    initOffline();
  </script>
</body>
</html>
